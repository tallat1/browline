name: NotchMVP
options:
  bundleIdPrefix: com.talatozcoban
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NotchCore:
    path: Packages/NotchCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: C6BVU6GSM6
targets:
  NotchMVP:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "NotchMVP.entitlements"
    dependencies:
      # Yalnız derleme sırası için; ikili Scripts/embed-adapter.sh ile Helpers'a kopyalanır.
      - target: notch
        embed: false
      - package: NotchCore
        product: ActivityAPI
      - package: NotchCore
        product: NotchShell
      - package: NotchCore
        product: ActivityEngine
      - package: NotchCore
        product: Integrations
    info:
      path: App/Info.plist
      properties:
        CFBundleName: NotchMVP
        CFBundleDisplayName: NotchMVP
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Ajan uygulama: Dock simgesi ve uygulama menüsü yok.
        LSUIElement: true
        NSHumanReadableCopyright: "Çalışma adı NotchMVP"
        NSAppleEventsUsageDescription: "MediaRemote kullanılamadığında Music ve Spotify'ı oynat/duraklat ve parça geçişi için denetlemek."
        NSCalendarsFullAccessUsageDescription: "Yaklaşan toplantıları notch'ta göstermek ve katılma bağlantısını açmak."
    entitlements:
      path: App/NotchMVP.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talatozcoban.notchmvp
        PRODUCT_NAME: NotchMVP
        GENERATE_INFOPLIST_FILE: NO
        # Kararlı imza: ad-hoc imza her derlemede değişir ve TCC izinleri (Takvim, Automation) sıfırlanır.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
    postBuildScripts:
      - name: Embed mediaremote-adapter
        script: "\"$SRCROOT/Scripts/embed-adapter.sh\""
        basedOnDependencyAnalysis: false
  notch:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    dependencies:
      - package: NotchCore
        product: ActivityAPI
    settings:
      base:
        PRODUCT_NAME: notch
        PRODUCT_BUNDLE_IDENTIFIER: com.talatozcoban.notchmvp.cli
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES

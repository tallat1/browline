name: Browline
options:
  bundleIdPrefix: com.talatozcoban
  # Kaynak dil Türkçe; İngilizce çeviri App/Localizable.xcstrings ve App/InfoPlist.xcstrings'te.
  developmentLanguage: tr
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  NotchCore:
    path: Packages/NotchCore
  # Terminal sekmesi (MIT). 1.12+ Metal gölgelendiricisi içeriyor (Metal Toolchain gerekir);
  # 1.11.2 Metal'siz. Derleme eklentisi var: xcodebuild -skipPackagePluginValidation.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    exactVersion: 1.11.2
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: C6BVU6GSM6
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  Browline:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "Browline.entitlements"
    dependencies:
      # Yalnız derleme sırası için; ikili Scripts/embed-adapter.sh ile Helpers'a kopyalanır.
      - target: notch
        embed: false
      - package: NotchCore
        product: ActivityAPI
      - package: NotchCore
        product: NotchShell
      - package: NotchCore
        product: ActivityEngine
      - package: NotchCore
        product: Integrations
      - package: SwiftTerm
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Browline
        CFBundleDisplayName: Browline
        CFBundleShortVersionString: "0.9.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        # Ajan uygulama: Dock simgesi ve uygulama menüsü yok.
        LSUIElement: true
        NSHumanReadableCopyright: "© 2026 Browline"
        NSAppleEventsUsageDescription: "Music ve Spotify'da çalanı denetlemek için: oynat/duraklat, parça geçişi ve konuma atlama."
        NSDesktopFolderUsageDescription: "Rafa bırakılan ekran görüntülerini kaydetmek ve dönüştürülen dosyaları asıllarının yanına yazmak için."
        NSDownloadsFolderUsageDescription: "İndirmeleri notch'ta göstermek ve sıkıştırılan ya da dönüştürülen dosyaları İndirilenler'e kaydetmek için."
        NSDocumentsFolderUsageDescription: "Dönüştürülen dosyaları Belgeler'deki asıllarının yanına kaydetmek için."
        NSCalendarsFullAccessUsageDescription: "Yaklaşan toplantıları notch'ta göstermek ve katılma bağlantısını açmak."
        NSRemindersFullAccessUsageDescription: "Bugün vadesi gelen anımsatıcıları Takvim sekmesinde göstermek ve tamamlandı işaretlemek için."
        NSCameraUsageDescription: "Ayna sekmesinde kendinizi görmeniz için. Görüntü kaydedilmez, hiçbir yere gönderilmez."
        NSAudioCaptureUsageDescription: "Çubukların çalan müziğe tepki vermesi için sesin anlık frekans dağılımını okumak. Ses kaydedilmez, hiçbir yere gönderilmez."
        # Etkinlik API'sinin URL kapısı: browline://push?id=…&title=… (Ayarlar'da ayrı anahtar, varsayılan kapalı)
        CFBundleURLTypes:
          - CFBundleURLName: com.talatozcoban.browline.activity
            CFBundleURLSchemes: [browline]
    entitlements:
      path: App/Browline.entitlements
      properties:
        com.apple.security.automation.apple-events: true
        com.apple.security.personal-information.calendars: true
        # Hardened runtime kamerayı yalnız bu yetkiyle açar (Ayna sekmesi).
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.talatozcoban.browline
        PRODUCT_NAME: Browline
        # Icon Composer simgesi (App/Browline.icon): macOS 26+ Liquid Glass; actool 14/15 için .icns de üretir.
        ASSETCATALOG_COMPILER_APPICON_NAME: Browline
        GENERATE_INFOPLIST_FILE: NO
        # Kararlı imza: ad-hoc imza her derlemede değişir ve TCC izinleri (Takvim, Automation) sıfırlanır.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        DEAD_CODE_STRIPPING: YES
    postBuildScripts:
      - name: Embed mediaremote-adapter
        script: "\"$SRCROOT/Scripts/embed-adapter.sh\""
        basedOnDependencyAnalysis: false
  notch:
    type: tool
    platform: macOS
    sources:
      - path: CLI
    dependencies:
      - package: NotchCore
        product: ActivityAPI
    settings:
      base:
        PRODUCT_NAME: notch
        PRODUCT_BUNDLE_IDENTIFIER: com.talatozcoban.browline.cli
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
